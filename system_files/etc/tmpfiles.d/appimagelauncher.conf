# AppImageLauncher AppDir lives in /usr/lib/ (OSTree-managed).
# Create a symlink in /var/opt/ on every boot so AppImageLauncher finds it.
# L+ removes any existing path first — needed for fresh deployments where
# bootc seeds /var/opt/appimagelauncher.AppDir from the image layer.
L+  /var/opt/appimagelauncher.AppDir  -  -  -  -  /usr/lib/appimagelauncher.AppDir
